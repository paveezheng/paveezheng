name: Generate Profile Assets

on:
  # 每 6 小时一次。刻意避开整点：GitHub 的 schedule 在 :00 是高峰，
  # 排队延迟明显，极端情况下会被丢弃。
  schedule:
    - cron: "17 */6 * * *"

  # 允许手动触发
  workflow_dispatch:

  # 推送到主分支时刷新
  push:
    branches:
      - main

# 所有产物都 force push 到同一个 output 分支。schedule 与 push 可能同时
# 触发，并发跑会互相覆盖，因此串行化。不取消进行中的运行，避免推送被打断
# 留下不完整的 output 分支。
concurrency:
  group: profile-assets
  cancel-in-progress: false

# 最小权限：只需要写 output 分支
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 贪吃蛇贡献图（浅色 + GitHub 深色模式各一份）
      # 用 STATS_TOKEN：snk 走 GraphQL contributionsCollection，
      # 读私有贡献需要 read:user scope
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}

      # 连续提交卡（用 STATS_TOKEN 以纳入私有贡献）
      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@v1.8.0
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight
          path: dist/streak.svg
          token: ${{ secrets.STATS_TOKEN }}

      # 统计卡（用 STATS_TOKEN 以纳入私有仓库）
      - name: Generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@v0.12.0
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 8
          AUTO_PUSH: false
          THEME: tokyonight

      - name: Collect summary cards into dist
        run: |
          mkdir -p dist/cards
          cp profile-summary-card-output/tokyonight/*.svg dist/cards/ 2>/dev/null || true

          echo "--- dist 内容 ---"
          find dist -type f | sort

          # summary-cards 内部单张卡渲染失败不会让上一步变红(action 自己吞了
          # 错误),而 cp 用通配符不会因缺文件报错,加上 build_dir 会整体替换
          # output 分支 —— 三者组合会静默删掉 README 正在引用的文件。
          # 这里显式校验:缺任何一个就让 job 失败,推送步骤不执行,
          # output 分支保留上一次的完好版本。
          missing=0
          for f in \
            dist/github-contribution-grid-snake.svg \
            dist/github-contribution-grid-snake-dark.svg \
            dist/streak.svg \
            dist/cards/3-stats.svg \
            dist/cards/1-repos-per-language.svg
          do
            if [ ! -s "$f" ]; then
              echo "::error::缺少 README 引用的产物: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || {
            echo "::error::产物不完整,已中止推送以保护 output 分支"
            exit 1
          }

      # 一次性推送。build_dir 会整体替换 output 分支内容，
      # 所以全部产物必须在同一次推送里。
      - name: Push assets to output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
